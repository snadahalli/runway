name: CI

# Runs the engine's tests everywhere, and proves the app still compiles on all
# three platforms. That second half is the point: the cross-platform code was
# written on a Mac, so Windows and Linux have no other way of being checked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04,   name: Linux }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux backend is GTK/WebKit; everything else ships with the runner.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Test the engine
        run: cargo test --workspace --all-targets

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The tray icon, window setup and notification wiring only fail to build
      # on the platform they're cfg'd for, so this is the real cross-platform gate.
      - name: Build the app
        run: cargo build -p runway-app --release
